<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Инструменты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --sec: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --card: var(--tg-theme-section-bg-color, #ffffff);
    --sep: rgba(128,128,128,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; font-size:16px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior:none;
  }
  .app{max-width:640px;margin:0 auto;padding:10px 16px 40px;}

  .topbar{display:flex;align-items:center;gap:10px;padding:10px 0 16px;min-height:52px;}
  .topbar h1{font-size:22px;font-weight:700;margin:0;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .back{
    background:var(--sec);border:0;color:var(--text);
    width:38px;height:38px;border-radius:50%;font-size:19px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:transform .12s;
  }
  .back:active{transform:scale(.92);}
  .hidden{display:none !important;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{
    background:var(--sec);border:0;border-radius:16px;
    padding:20px 14px;display:flex;flex-direction:column;
    align-items:center;gap:10px;cursor:pointer;color:var(--text);
    font-family:inherit;font-size:14px;font-weight:600;text-align:center;
    transition:transform .12s, opacity .12s;min-height:108px;justify-content:center;
  }
  .card:active{transform:scale(.96);opacity:.8;}
  .card .ico{font-size:30px;line-height:1;}

  .panel{animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  label.fld{display:block;font-size:13px;color:var(--hint);margin:0 0 6px 2px;font-weight:500;}

  textarea,input[type=text],input[type=password],input[type=datetime-local]{
    width:100%;background:var(--sec);border:1.5px solid transparent;
    border-radius:12px;padding:12px 14px;color:var(--text);
    font-family:inherit;font-size:16px;line-height:1.45;resize:vertical;
    outline:none;transition:border-color .15s;
    -webkit-appearance:none;appearance:none;
  }
  textarea{min-height:110px;}
  textarea:focus,input[type=text]:focus,input[type=password]:focus,input[type=datetime-local]:focus{border-color:var(--btn);}
  textarea::placeholder,input::placeholder{color:var(--hint);}
  input[type=password]::-ms-reveal,
  input[type=password]::-ms-clear{display:none;}

  /* Обёртка для поля с паролем + кнопка "глаз" */
  .pwd-wrap{position:relative;display:block;}
  .pwd-wrap input{padding-right:48px;}
  .pwd-toggle{
    position:absolute;right:5px;top:50%;transform:translateY(-50%);
    background:transparent;border:0;color:var(--hint);
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:18px;font-family:inherit;
    transition:background .15s,color .15s,transform .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .pwd-toggle:active{transform:translateY(-50%) scale(.9);}
  .pwd-toggle.on{color:var(--btn);}

  .seg{display:flex;background:var(--sec);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px;}
  .seg button{
    flex:1;border:0;background:transparent;color:var(--text);
    padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;
    font-family:inherit;cursor:pointer;transition:background .15s;
  }
  .seg button.on{background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.12);}

  .row{display:flex;gap:10px;margin-top:12px;}
  .btn{
    flex:1;border:0;border-radius:12px;padding:13px 16px;
    font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
    background:var(--btn);color:var(--btn-text);transition:transform .12s,opacity .12s;
  }
  .btn.ghost{background:var(--sec);color:var(--text);}
  .btn:active{transform:scale(.97);opacity:.85;}
  .btn:disabled{opacity:.45;}
  .btn.sm{padding:8px 12px;font-size:13px;flex:0 1 auto;border-radius:10px;}

  .out{
    margin-top:14px;background:var(--sec);border-radius:12px;
    padding:14px;font-size:15px;word-break:break-word;
    white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    line-height:1.5;position:relative;min-height:52px;
  }
  .out.small{font-size:13.5px;}
  .out .empty{color:var(--hint);font-family:inherit;font-weight:400;}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .stat{background:var(--sec);border-radius:12px;padding:12px 14px;}
  .stat .v{font-size:22px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;}
  .stat .k{font-size:12px;color:var(--hint);margin-top:3px;}

  .hashrow{margin-top:12px;}
  .hashrow .name{font-size:12px;color:var(--hint);font-weight:600;letter-spacing:.4px;margin-bottom:5px;}
  .hashrow .val{
    background:var(--sec);border-radius:12px;padding:12px 14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px;word-break:break-all;line-height:1.5;
    display:flex;align-items:flex-start;gap:8px;
  }
  .hashrow .val span{flex:1;}
  .mini{
    background:transparent;border:0;color:var(--link);font-size:12px;
    font-weight:600;cursor:pointer;padding:2px 0;font-family:inherit;flex-shrink:0;
  }

  .letters{
    background:var(--sec);border-radius:12px;padding:12px;
    display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow-y:auto;
    min-height:52px;align-content:flex-start;
  }
  .ltr{
    background:var(--bg);border-radius:8px;padding:5px 9px;
    font-size:13px;display:inline-flex;align-items:center;gap:6px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .ltr b{font-weight:700;}
  .ltr .cnt{color:var(--hint);font-size:12px;font-weight:700;}

  .qrbox{
    margin-top:14px;background:#fff;border-radius:16px;padding:14px;
    display:flex;justify-content:center;align-items:center;min-height:120px;
  }
  .qrbox canvas{width:100%;max-width:300px;height:auto;image-rendering:pixelated;display:block;}

  .err{color:#e0453e;font-size:13px;margin-top:10px;font-weight:500;}
  .hintnote{color:var(--hint);font-size:12px;margin-top:10px;text-align:center;}

  .chk{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 0;cursor:pointer;user-select:none;}
  .chk input{width:18px;height:18px;accent-color:var(--btn);flex-shrink:0;}

  input[type=range]{
    width:100%;height:32px;accent-color:var(--btn);background:transparent;
  }

  .strength{height:8px;background:var(--sec);border-radius:6px;margin-top:12px;overflow:hidden;}
  .strength .bar{height:100%;width:0;transition:width .3s,background .3s;border-radius:6px;}

  .caseBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .caseBtns .btn{padding:8px 12px;font-size:13px;flex:0 1 auto;border-radius:10px;}

  .colorPreview{
    height:96px;border-radius:14px;margin-bottom:16px;
    border:1px solid var(--sep);background:#3498db;
  }

  .diff{background:var(--sec);border-radius:12px;padding:10px;max-height:400px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.45;}
  .diff .line{padding:1px 6px;white-space:pre-wrap;word-break:break-word;border-radius:4px;}
  .diff .add{background:rgba(52,199,89,.18);color:#1c7c3f;}
  .diff .del{background:rgba(255,59,48,.18);color:#b03a2e;}
  .diff .same{color:var(--hint);}
  .diff .hdr{color:var(--hint);font-size:11px;letter-spacing:.4px;margin:8px 6px 4px;font-weight:600;}
  @media (prefers-color-scheme: dark){
    .diff .add{color:#7ee2a8;}
    .diff .del{color:#ff8a82;}
  }

  select.sel{
    width:100%;background:var(--sec);border:1.5px solid transparent;
    border-radius:12px;padding:11px 32px 11px 14px;color:var(--text);
    font-family:inherit;font-size:15px;outline:none;appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23888' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
  }

  input[type=color]{
    width:100%;height:52px;border:0;border-radius:12px;
    background:var(--sec);padding:4px;cursor:pointer;
  }

  .imgbox{
    background:var(--sec);border-radius:14px;padding:8px;
    display:flex;justify-content:center;overflow:hidden;
  }
  .imgbox canvas{max-width:100%;height:auto;border-radius:8px;display:block;}
  .resultImg{
    width:100%;max-width:100%;height:auto;border-radius:8px;display:block;
  }
  .drop{
    background:var(--sec);border:2px dashed var(--sep);border-radius:14px;
    padding:24px 16px;text-align:center;cursor:pointer;font-size:14px;
    transition:border-color .2s, background .2s;
  }
  .drop:active{border-color:var(--btn);}
  .drop .ic{font-size:30px;display:block;margin-bottom:4px;}
  .drop .lbl{color:var(--hint);}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:22px;
    font-size:14px;font-weight:500;opacity:0;pointer-events:none;
    transition:all .22s;z-index:99;backdrop-filter:blur(8px);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="back hidden" id="backBtn">←</button>
    <h1 id="title">Инструменты</h1>
  </div>
  <div id="main"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Telegram WebApp + MainButton
   ============================================================ */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try { tg.ready(); tg.expand(); } catch(e){}
  if (tg.BackButton) tg.BackButton.onClick(() => goHome());
  if (tg.setHeaderColor) { try { tg.setHeaderColor('secondary_bg_color'); } catch(e){} }
}

let _mbGetter = null;

function setMainButton(getter){
  _mbGetter = getter;
  refreshMainButton();
}
function refreshMainButton(){
  if (!tg || !tg.MainButton) return;
  if (!_mbGetter){ try { tg.MainButton.hide(); } catch(e){} return; }
  let r = '';
  try { r = _mbGetter() || ''; } catch(e){ r = ''; }
  if (String(r).trim().length){
    try {
      tg.MainButton.setText('Отправить в чат');
      tg.MainButton.show();
    } catch(e){}
  } else {
    try { tg.MainButton.hide(); } catch(e){}
  }
}
if (tg && tg.MainButton){
  tg.MainButton.onClick(() => {
    if (!_mbGetter) return;
    let text = '';
    try { text = String(_mbGetter() || ''); } catch(e){}
    if (!text.trim()) return;
    try {
      tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(text));
    } catch(e){}
  });
}

/* ============================================================
   Утилиты
   ============================================================ */
const enc = new TextEncoder();
const dec = new TextDecoder();

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}
async function copyText(txt){
  if (!txt) return;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(txt);
    } else {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    toast('Скопировано');
    if (tg && tg.HapticFeedback) try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
  } catch(e) { toast('Не удалось скопировать'); }
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   MD5
   ============================================================ */
function md5(str){
  const bytes = enc.encode(str);
  const S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
             5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
             4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
             6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K = new Uint32Array(64);
  for (let i=0;i<64;i++) K[i] = Math.floor(Math.abs(Math.sin(i+1)) * 4294967296);
  const len = bytes.length, bitLen = len * 8;
  const padLen = ((len + 8) >> 6 << 6) + 64;
  const buf = new Uint8Array(padLen); buf.set(bytes); buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(padLen - 8, bitLen >>> 0, true);
  dv.setUint32(padLen - 4, Math.floor(bitLen / 4294967296), true);
  let a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
  const M = new Uint32Array(16);
  for (let off=0; off<padLen; off+=64){
    for (let i=0;i<16;i++) M[i] = dv.getUint32(off + i*4, true);
    let A=a0,B=b0,C=c0,D=d0;
    for (let i=0;i<64;i++){
      let F,g;
      if (i<16){F=(B&C)|(~B&D);g=i;}
      else if (i<32){F=(D&B)|(~D&C);g=(5*i+1)%16;}
      else if (i<48){F=B^C^D;g=(3*i+5)%16;}
      else{F=C^(B|~D);g=(7*i)%16;}
      F=(F+A+K[i]+M[g])>>>0;
      A=D;D=C;C=B;B=(B+(((F<<S[i])|(F>>>(32-S[i])))>>>0))>>>0;
    }
    a0=(a0+A)>>>0;b0=(b0+B)>>>0;c0=(c0+C)>>>0;d0=(d0+D)>>>0;
  }
  const out = new Uint8Array(16);
  const odv = new DataView(out.buffer);
  odv.setUint32(0,a0,true);odv.setUint32(4,b0,true);
  odv.setUint32(8,c0,true);odv.setUint32(12,d0,true);
  let hex='';
  for (let i=0;i<16;i++) hex += out[i].toString(16).padStart(2,'0');
  return hex;
}

/* ============================================================
   SHA-256
   ============================================================ */
function sha256(str){
  const bytes = enc.encode(str);
  const K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const rotr = (x,n) => (x>>>n)|(x<<(32-n));
  const len = bytes.length, bitLen = len*8;
  const padLen = ((len+8)>>6<<6)+64;
  const buf = new Uint8Array(padLen); buf.set(bytes); buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(padLen-8, Math.floor(bitLen/4294967296), false);
  dv.setUint32(padLen-4, bitLen>>>0, false);
  const w = new Uint32Array(64);
  for (let off=0; off<padLen; off+=64){
    for (let i=0;i<16;i++) w[i] = dv.getUint32(off+i*4,false);
    for (let i=16;i<64;i++){
      const s0 = rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
      const s1 = rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
      w[i] = (w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (let i=0;i<64;i++){
      const S1 = rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch = (e&f)^(~e&g);
      const t1 = (h+S1+ch+K[i]+w[i])>>>0;
      const S0 = rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj = (a&b)^(a&c)^(b&c);
      const t2 = (S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  let out='';
  for (let i=0;i<8;i++) out += H[i].toString(16).padStart(8,'0');
  return out;
}

/* ============================================================
   Base64
   ============================================================ */
function b64Encode(str){
  const bytes = enc.encode(str);
  let bin='';
  const CH = 0x8000;
  for (let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(bin);
}
function b64Decode(b64){
  const clean = b64.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');
  const pad = clean.length % 4 ? '='.repeat(4 - clean.length % 4) : '';
  const bin = atob(clean + pad);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return dec.decode(bytes);
}

/* ============================================================
   Раскладка RU ↔ EN
   ============================================================ */
const RU_TO_EN_CHARS = {
  'й':'q','ц':'w','у':'e','к':'r','е':'t','н':'y','г':'u','ш':'i',
  'щ':'o','з':'p','х':'[','ъ':']','ф':'a','ы':'s','в':'d','а':'f',
  'п':'g','р':'h','о':'j','л':'k','д':'l','ж':';','э':"'",'я':'z',
  'ч':'x','с':'c','м':'v','и':'b','т':'n','ь':'m','б':',','ю':'.',
  'ё':'`',
  'Й':'Q','Ц':'W','У':'E','К':'R','Е':'T','Н':'Y','Г':'U','Ш':'I',
  'Щ':'O','З':'P','Х':'{','Ъ':'}','Ф':'A','Ы':'S','В':'D','А':'F',
  'П':'G','Р':'H','О':'J','Л':'K','Д':'L','Ж':':','Э':'"','Я':'Z',
  'Ч':'X','С':'C','М':'V','И':'B','Т':'N','Ь':'M','Б':'<','Ю':'>',
  'Ё':'~'
};
const EN_TO_RU_CHARS = (() => { const o={}; for (const [k,v] of Object.entries(RU_TO_EN_CHARS)) o[v]=k; return o; })();

function convertLayout(text, dir, convertPunct = false){
  const map = dir === 'ru-en' ? RU_TO_EN_CHARS : EN_TO_RU_CHARS;
  const RE_LETTER = /\p{L}/u;
  let out = '';
  for (const ch of text){
    if (!convertPunct && !RE_LETTER.test(ch)){ out += ch; continue; }
    out += (map[ch] !== undefined) ? map[ch] : ch;
  }
  return out;

function genPassword(len, opts){
  let alphabet = '';
  if (opts.lower) alphabet += 'abcdefghijklmnopqrstuvwxyz';
  if (opts.upper) alphabet += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (opts.digits) alphabet += '0123456789';
  if (opts.symbols) alphabet += '!@#$%^&*()-_=+[]{};:,.?/';
  if (opts.noSimilar) alphabet = alphabet.replace(/[l1IO0o]/g, '');
  if (!alphabet) return '';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let out = '';
  for (let i=0;i<len;i++) out += alphabet[arr[i] % alphabet.length];
  return out;
}
function passwordStrength(pw){
  if (!pw) return {bits: 0, label: '—', color: 'var(--hint)', pct: 0};
  const sets = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^a-zA-Z0-9]/].filter(r => r.test(pw)).length;
  const size = sets >= 4 ? 95 : sets === 3 ? 62 : sets === 2 ? 52 : 26;
  const bits = Math.round(pw.length * Math.log2(size));
  let label, color, pct;
  if (bits < 40){ label = 'Слабый'; color = '#e0453e'; pct = 25; }
  else if (bits < 60){ label = 'Средний'; color = '#f5a623'; pct = 50; }
  else if (bits < 80){ label = 'Хороший'; color = '#8bc34a'; pct = 75; }
  else { label = 'Отличный'; color = '#34c759'; pct = 100; }
  return {bits, label, color, pct};
}

/* ============================================================
   Diff (LCS)
   ============================================================ */
function diffLines(a, b){
  const A = a.split('\n'), B = b.split('\n');
  const m = A.length, n = B.length;
  const dp = Array.from({length: m+1}, () => new Uint16Array(n+1));
  for (let i=1;i<=m;i++){
    for (let j=1;j<=n;j++){
      if (A[i-1] === B[j-1]) dp[i][j] = dp[i-1][j-1] + 1;
      else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const res = [];
  let i=m, j=n;
  while (i>0 && j>0){
    if (A[i-1] === B[j-1]){ res.unshift({t:'same', s:A[i-1]}); i--; j--; }
    else if (dp[i-1][j] >= dp[i][j-1]){ res.unshift({t:'del', s:A[i-1]}); i--; }
    else { res.unshift({t:'add', s:B[j-1]}); j--; }
  }
  while (i>0){ res.unshift({t:'del', s:A[i-1]}); i--; }
  while (j>0){ res.unshift({t:'add', s:B[j-1]}); j--; }
  return res;
}

        if (ind < baseIndent || ind > baseIndent) break;
        const content = line.trimStart();
        if (!content.startsWith('-')) break;
        const rest = content === '-' ? '' : content.slice(1).trimStart();
        i++;
        if (rest === ''){
          arr.push(parseBlock(baseIndent + 2));
        } else if (/^[^:]+:\s?/.test(rest) && !rest.startsWith('[') && !rest.startsWith('{')){
          const obj = {};
          const m = rest.match(/^([^:]+):\s*(.*)$/);
          const k = m[1].trim();
          const v = m[2].trim();
          obj[k] = v === '' ? parseBlock(baseIndent + 4) : parseScalarValue(v);
          while (i < lines.length){
            const l = lines[i];
            const li = getIndent(l);
            if (li !== baseIndent + 2) break;
            const c = l.trimStart();
            if (c.startsWith('-')) break;
            const mm = c.match(/^([^:]+):\s*(.*)$/);
            if (!mm) break;
            i++;
            const kk = mm[1].trim();
            const vv = mm[2].trim();
            obj[kk] = vv === '' ? parseBlock(baseIndent + 4) : parseScalarValue(vv);
          }
          arr.push(obj);
        } else {
          arr.push(parseScalarValue(rest));
        }
      }
      return arr;
    }
    const obj = {};
    while (i < lines.length){
      const line = lines[i];
      const ind = getIndent(line);
      if (ind < baseIndent || ind > baseIndent) break;
      const content = line.trimStart();
      const m = content.match(/^([^:]+):\s*(.*)$/);
      if (!m) break;
      i++;
      const k = m[1].trim();
      const v = m[2].trim();
      if (v === ''){
        if (i < lines.length && getIndent(lines[i]) > baseIndent){
          obj[k] = parseBlock(getIndent(lines[i]));
        } else obj[k] = null;
      } else {
        obj[k] = parseScalarValue(v);
      }
    }
    return obj;
  }
  return parseBlock(0);
}
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r'){}
      else field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const header = rows[0];
  return rows.slice(1).map(r => {
    const o = {};
    header.forEach((h,idx) => o[h] = r[idx] !== undefined ? r[idx] : '');
    return o;
  });
}
function csvCell(v){
  if (v === null || v === undefined) return '';
  const s = String(v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function stringifyCSV(data){
  if (!Array.isArray(data)){
    if (typeof data === 'object' && data !== null) data = [data];
    else return String(data);
  }
  if (!data.length) return '';
  if (typeof data[0] !== 'object' || data[0] === null || Array.isArray(data[0])){
    return data.map(r => Array.isArray(r) ? r.map(csvCell).join(',') : csvCell(r)).join('\n');
  }
  const headers = [...new Set(data.flatMap(o => Object.keys(o)))];
  const lines = [headers.map(csvCell).join(',')];
  for (const o of data){
    lines.push(headers.map(h => csvCell(o[h])).join(','));
  }
  return lines.join('\n');
}

/* ============================================================
   Стеганография (текст)
   ============================================================ */
function stegEncode(cover, secret){
  if (!secret) return cover;
  let bits = '';
  for (let i=0;i<secret.length;i++){
    bits += secret.charCodeAt(i).toString(2).padStart(16,'0');
  }
  let zw = '\u2060';
  for (const b of bits) zw += b === '0' ? '\u200B' : '\u200C';
  zw += '\u2060';
  return cover + zw;
}
function stegDecode(text){
  const m = text.match(/\u2060([\u200B\u200C]*)\u2060/);
  if (!m) return null;
  const bits = m[1];
  if (bits.length % 16 !== 0) return null;
  let out = '';
  for (let i=0;i<bits.length;i+=16){
    let code = 0;
    for (let j=0;j<16;j++) code = (code<<1) | (bits[i+j] === '\u200C' ? 1 : 0);
    out += String.fromCharCode(code);
  }
  return out;
}

function convertUnit(value, cat, from, to){
  if (cat === 'temp'){
    let c;
    if (from === 'C') c = value;
    else if (from === 'F') c = (value - 32) * 5/9;
    else c = value - 273.15;
    if (to === 'C') return c;
    if (to === 'F') return c * 9/5 + 32;
    return c + 273.15;
  }
  const u = UNITS[cat].units;
  return value * u[from].f / u[to].f;
}

    const d = diffLines(A.value, B.value);
    let added = 0, removed = 0;
    out.innerHTML = d.map(item => {
      if (item.t === 'add'){ added++; return `<div class="line add">+ ${esc(item.s) || ' '}</div>`; }
      if (item.t === 'del'){ removed++; return `<div class="line del">− ${esc(item.s) || ' '}</div>`; }
      return `<div class="line same">  ${esc(item.s) || ' '}</div>`;
    }).join('') + `<div class="hdr">+${added} добавлено, −${removed} удалено</div>`;
    diffText = d.map(i => (i.t==='add'?'+ ':i.t==='del'?'- ':'  ') + i.s).join('\n');
    refreshMainButton();
  };
  el.querySelector('#goBtn').onclick = run;
  A.addEventListener('input', () => { if (B.value) run(); });
  B.addEventListener('input', () => { if (A.value) run(); });

  setMainButton(() => diffText);
  setTimeout(() => A.focus(), 120);
}

/* ── 8. Стеганография в изображение ──────────────────────── */
function renderStegImage(el){

  let fileName = 'stego.png';

  const MAGIC = [0x53, 0x54, 0x45, 0x47]; // "STEG"

  // ─── Данные пользователя из Telegram ────────────────────
  const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
  const autoChatId = tgUser ? String(tgUser.id) : '';

  el.innerHTML = `

        <div class="pwd-wrap">
          <input type="password" id="encPwd" placeholder="Без пароля, если оставить пустым" autocomplete="new-password">

        <label class="fld" style="margin-top:14px">Пароль</label>
        <div class="pwd-wrap">
          <input type="password" id="decPwd" placeholder="Введите пароль от изображения" autocomplete="current-password">
          <button type="button" class="pwd-toggle" data-for="decPwd" aria-label="Показать пароль">👁</button>
        </div>
        <div class="hintnote" style="margin-top:8px;text-align:left">Если пароль не задавали — оставьте поле пустым.</div>
      </div>

      <div class="row hidden" id="actions" style="margin-top:14px">
        <button class="btn" id="goBtn">Спрятать</button>
      </div>

      <div id="resultBlock" class="hidden" style="margin-top:16px">
        <label class="fld">Готовое изображение</label>
        <div class="imgbox"><img id="resultImg" class="resultImg" alt="Результат"></div>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="botBtn">📨 Отправить боту</button>
        </div>
        <div class="row">
          <button class="btn ghost" id="shareBtn">📤 Поделиться</button>
          <button class="btn ghost" id="dlBtn">Скачать PNG</button>
        </div>
        <div class="row">
          <button class="btn ghost" id="openBtn">Открыть</button>
          <button class="btn ghost" id="b64Btn">Копировать Base64</button>
        </div>

        <div id="botSettings" class="hidden" style="margin-top:14px;padding:14px;background:var(--sec);border-radius:12px">
          <label class="fld" style="margin-top:0">Токен бота <span style="font-weight:400;opacity:.7">— от @BotFather</span></label>
          <div class="pwd-wrap">
            <input type="password" id="botToken" placeholder="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ" autocomplete="off">
            <button type="button" class="pwd-toggle" data-for="botToken" aria-label="Показать токен">👁</button>
          </div>
          <label class="fld" style="margin-top:12px">Chat ID</label>
          <input type="text" id="botChat" placeholder="Ваш ID" value="${esc(autoChatId)}" inputmode="numeric" autocomplete="off">
          <div class="hintnote" style="text-align:left;margin-top:8px">
            Обязательно напишите боту <b>/start</b> — иначе Telegram запретит боту первым писать вам.
          </div>
          <div class="row">
            <button class="btn" id="botSend">Отправить</button>
            <button class="btn ghost" id="botCancel">Отмена</button>
          </div>
          <div id="botStatus" class="hintnote" style="text-align:left"></div>
        </div>

        <div class="hintnote">Только PNG без потерь — при пересохранении в JPEG данные потеряются.</div>
      </div>

      <label class="fld" style="margin-top:16px" id="outLbl">Результат</label>
      <div class="out" id="out"><span class="empty">—</span></div>
      <div class="err hidden" id="err"></div>
      <div class="hintnote">Только PNG без потерь. JPEG / WebP при пересохранении испортят LSB.</div>
    </div>`;

  const $ = id => el.querySelector('#' + id);
  const seg = $('seg'), drop = $('drop'), dropText = $('dropText');
  const previewBox = $('preview'), cv = $('cv');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const encBlock = $('encBlock'), decBlock = $('decBlock');
  const secret = $('secret'), encPwd = $('encPwd'), decPwd = $('decPwd');
  const actions = $('actions'), goBtn = $('goBtn');
  const resultBlock = $('resultBlock'), resultImg = $('resultImg');
  const out = $('out'), err = $('err'), info = $('info'), outLbl = $('outLbl');
  const botSettings = $('botSettings'), botStatus = $('botStatus');

  const showErr = msg => { err.textContent = msg; err.classList.remove('hidden'); };
  const hideErr = () => err.classList.add('hidden');

  /* ─────── Крипто ─────── */
  function deriveKeyStream(password, length){
    const key = new Uint8Array(length);
    let offset = 0, counter = 0;
    while (offset < length){
      const hash = sha256(password + '|steg|' + counter);
      for (let i = 0; i < 32 && offset < length; i++){
        key[offset++] = parseInt(hash.substr(i * 2, 2), 16);
      }
      counter++;
    }
    return key;
  }
  function passwordCheckBytes(password){
    const hash = sha256('check|' + password);
    return [
      parseInt(hash.substr(0, 2), 16),
      parseInt(hash.substr(2, 2), 16),
      parseInt(hash.substr(4, 2), 16),
      parseInt(hash.substr(6, 2), 16)
    ];
  }

  /* ─────── LSB ─────── */
  function bitsFromImage(data){
    const bits = [];
    for (let i = 0; i < data.length; i++){
      if (i % 4 === 3) continue;
      bits.push(data[i] & 1);
    }
    return bits;
  }

  function encodeInto(dataImg, text, password){
    const plaintext = enc.encode(text);
    let body, flags = 0;

    if (password){
      const check = passwordCheckBytes(password);
      const withCheck = new Uint8Array(4 + plaintext.length);
      withCheck[0] = check[0]; withCheck[1] = check[1];
      withCheck[2] = check[2]; withCheck[3] = check[3];
      withCheck.set(plaintext, 4);
      const ks = deriveKeyStream(password, withCheck.length);
      body = new Uint8Array(withCheck.length);
      for (let i = 0; i < withCheck.length; i++) body[i] = withCheck[i] ^ ks[i];
      flags = 1;
    } else {
      body = plaintext;
    }

    const bits = [];
    const put = (val, len) => { for (let i = len-1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(MAGIC[0], 8); put(MAGIC[1], 8); put(MAGIC[2], 8); put(MAGIC[3], 8);
    put(flags, 8);
    put(body.length, 32);
    for (const b of body) put(b, 8);

    const data = dataImg.data;
    let cap = 0;
    for (let i = 0; i < data.length; i++) if (i % 4 !== 3) cap++;
    if (bits.length > cap){
      const need = Math.ceil(bits.length / 8);
      const have = Math.floor(cap / 8);
      throw new Error(`Мало места: нужно ${need.toLocaleString('ru-RU')} Б, доступно ${have.toLocaleString('ru-RU')} Б`);
    }

    let bitIdx = 0;
    for (let i = 0; i < data.length && bitIdx < bits.length; i++){
      if (i % 4 === 3) continue;
      data[i] = (data[i] & 0xFE) | bits[bitIdx];
      bitIdx++;
    }
    return dataImg;
  }

  function decodeFrom(dataImg, password){
    const bits = bitsFromImage(dataImg.data);
    if (bits.length < 72) throw new Error('Изображение слишком маленькое');

    const readByte = off => {
      let v = 0;
      for (let i = 0; i < 8; i++) v = (v << 1) | bits[off + i];
      return v;
    };

    for (let i = 0; i < 4; i++){
      if (readByte(i * 8) !== MAGIC[i]) throw new Error('Скрытое сообщение не найдено');
    }
    const flags = readByte(32);
    const pwdProtected = (flags & 1) === 1;

    let len = 0;
    for (let i = 0; i < 32; i++) len = (len << 1) | bits[40 + i];
    if (len <= 0 || len > Math.floor((bits.length - 72) / 8)){
      throw new Error('Повреждённое сообщение или неверный файл');
    }

    const bytes = new Uint8Array(len);
    for (let b = 0; b < len; b++){
      let v = 0;
      for (let j = 0; j < 8; j++) v = (v << 1) | bits[72 + b * 8 + j];
      bytes[b] = v;
    }

    if (pwdProtected){
      if (!password) throw new Error('Изображение защищено паролем');
      const ks = deriveKeyStream(password, len);
      for (let i = 0; i < len; i++) bytes[i] ^= ks[i];
      const check = passwordCheckBytes(password);
      if (bytes[0] !== check[0] || bytes[1] !== check[1] ||
          bytes[2] !== check[2] || bytes[3] !== check[3]){
        throw new Error('Неверный пароль');
      }
      return dec.decode(bytes.subarray(4));
    }
    return dec.decode(bytes);
  }

  function setMode(m){
    mode = m;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.m === m));
    if (m === 'enc'){
      encBlock.classList.remove('hidden');
      decBlock.classList.add('hidden');
      outLbl.textContent = 'Статус';
      goBtn.textContent = 'Спрятать';
    } else {
      encBlock.classList.add('hidden');
      decBlock.classList.remove('hidden');
      outLbl.textContent = 'Извлечённый текст';
      goBtn.textContent = 'Извлечь';
    }
    resultBlock.classList.add('hidden');
    botSettings.classList.add('hidden');
    out.innerHTML = '<span class="empty">—</span>';
    resultUrl = null;
    hideErr();
    if (imgData && m === 'dec') setTimeout(runExtract, 30);
  }

  seg.addEventListener('click', e => {
    const b = e.target.closest('button[data-m]');
    if (b) setMode(b.dataset.m);
  });

  function loadFile(file){
    if (!file) return;
    hideErr();
    if (!file.type.startsWith('image/')){ showErr('Это не изображение'); return; }
    fileName = file.name.replace(/\.[^.]+$/, '') + '-stego.png';

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      const MAX = 2000;
      if (Math.max(w, h) > MAX){
        const k = MAX / Math.max(w, h);
        w = Math.round(w * k); h = Math.round(h * k);
      }
      cv.width = w; cv.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      imgData = ctx.getImageData(0, 0, w, h);

      previewBox.classList.remove('hidden');
      actions.classList.remove('hidden');
      resultBlock.classList.add('hidden');
      dropText.textContent = file.name;

      const capBytes = Math.floor((w * h * 3) / 8) - 9;
      info.textContent = `${w}×${h} px • доступно ~${capBytes.toLocaleString('ru-RU')} символов UTF-8`;

      if (mode === 'dec') runExtract();
      else out.innerHTML = '<span class="empty">Введите сообщение и нажмите «Спрятать»…</span>';
    };
    img.onerror = () => { URL.revokeObjectURL(url); showErr('Не удалось открыть изображение'); };
    img.src = url;
  }

  function runExtract(){
    hideErr();
    if (!imgData){ showErr('Сначала загрузите изображение'); return; }
    try {
      const pwd = decPwd.value;
      const text = decodeFrom(imgData, pwd);
      out.textContent = text;
      toast('Сообщение извлечено');
      if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
    } catch(e){
      out.innerHTML = '<span class="empty">—</span>';
      showErr(e.message || 'Ошибка');
    }
  }

  function runHide(){
    hideErr();
    if (!imgData){ showErr('Сначала загрузите изображение'); return; }
    const text = secret.value;
    if (!text){ showErr('Введите текст для сокрытия'); return; }
    try {
      const copy = new ImageData(
        new Uint8ClampedArray(imgData.data),
        imgData.width, imgData.height
      );
      encodeInto(copy, text, encPwd.value || '');
      ctx.putImageData(copy, 0, 0);
      resultUrl = cv.toDataURL('image/png');
      resultImg.src = resultUrl;
      resultBlock.classList.remove('hidden');
      botSettings.classList.add('hidden');
      const pwdMsg = encPwd.value ? ' с паролем' : '';
      out.textContent = `Готово! Сообщение длиной ${text.length} симв.${pwdMsg} спрятано.`;
      toast('Сообщение спрятано');
      if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
      setTimeout(() => resultBlock.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    } catch(e){
      showErr(e.message || 'Ошибка');
    }
  }

  goBtn.onclick = () => { mode === 'enc' ? runHide() : runExtract(); };

  /* ─────── Отправка боту ─────── */
  const TOKEN_KEY = 'steg_bot_token';
  const CHAT_KEY  = 'steg_bot_chat';

  async function sendToBot(token, chatId, caption){
    const res = await fetch(resultUrl);
    const blob = await res.blob();

    const form = new FormData();
    form.append('chat_id', chatId);
    form.append('document', blob, fileName);
    if (caption) form.append('caption', caption);

    const r = await fetch(`https://api.telegram.org/bot${token}/sendDocument`, {
      method: 'POST',
      body: form
    });
    const data = await r.json().catch(() => ({ ok: false, description: 'Некорректный ответ сервера' }));
    if (!data.ok) throw new Error(data.description || 'Bot API вернул ошибку');
    return data.result;
  }

  async function doSend(){
    if (!resultUrl){ toast('Сначала спрячьте сообщение'); return; }
    const token = $('botToken').value.trim();
    const chatId = $('botChat').value.trim();
    if (!token)  { botStatus.textContent = 'Введите токен бота'; botStatus.style.color = '#e0453e'; return; }
    if (!chatId) { botStatus.textContent = 'Введите Chat ID'; botStatus.style.color = '#e0453e'; return; }

    localStorage.setItem(TOKEN_KEY, token);
    localStorage.setItem(CHAT_KEY, chatId);

    const btn = $('botSend');
    btn.disabled = true;
    const oldText = btn.textContent;
    btn.textContent = 'Отправляем…';
    botStatus.textContent = 'Загрузка файла…';
    botStatus.style.color = 'var(--hint)';

    try {
      const caption = `🖼️ Изображение со скрытым сообщением (${fileName})`;
      await sendToBot(token, chatId, caption);
      botStatus.textContent = '✅ Отправлено! Проверьте чат с ботом.';
      botStatus.style.color = '#34c759';
      toast('Отправлено боту');
      if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
      setTimeout(() => { botSettings.classList.add('hidden'); }, 1200);
    } catch(e){
      const msg = e.message || 'Ошибка';
      let friendly = msg;
      if (/chat not found/i.test(msg))       friendly = 'Chat не найден. Напишите боту /start и попробуйте снова.';
      else if (/unauthorized/i.test(msg))    friendly = 'Неверный токен бота. Проверьте у @BotFather.';
      else if (/bot can't initiate/i.test(msg)) friendly = 'Сначала напишите боту /start — он не может писать первым.';
      else if (/file is too big/i.test(msg)) friendly = 'Файл слишком большой для Bot API (лимит 50 МБ).';
      botStatus.textContent = '❌ ' + friendly;
      botStatus.style.color = '#e0453e';
      if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('error'); } catch(e){}
    } finally {
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }

  $('botBtn').onclick = () => {
    if (!resultUrl){ toast('Сначала спрячьте сообщение'); return; }
    const token = localStorage.getItem(TOKEN_KEY) || '';
    const chat = localStorage.getItem(CHAT_KEY) || autoChatId;
    if (token){
      $('botToken').value = token;
      $('botChat').value = chat;
      botSettings.classList.remove('hidden');
      doSend();
    } else {
      botSettings.classList.remove('hidden');
      $('botToken').focus();
      setTimeout(() => botSettings.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
    }
  };

  $('botCancel').onclick = () => {
    botSettings.classList.add('hidden');
    botStatus.textContent = '';
  };

  $('botSend').onclick = doSend;

  // ── Поделиться ────────────────────────────────────────
  $('shareBtn').onclick = async () => {
    if (!resultUrl){ toast('Сначала спрячьте сообщение'); return; }
    const btn = $('shareBtn');
    const oldText = btn.textContent;
    btn.textContent = 'Открываем…';
    btn.disabled = true;
    try {
      const ok = await shareImageFile(resultUrl, fileName);
      if (!ok){
        toast('Поделиться недоступно — открываем картинку');
        try {
          if (tg) tg.openLink(resultUrl);
          else window.open(resultUrl, '_blank');
        } catch(_){
          toast('Нажмите «Скачать PNG» или удерживайте картинку');
        }
      }
    } finally {
      btn.textContent = oldText;
      btn.disabled = false;
    }
  };

  // ── Открыть в браузере ────────────────────────────────
  $('openBtn').onclick = () => {
    if (!resultUrl){ toast('Сначала спрячьте сообщение'); return; }

function renderTimestamp(el){
  el.innerHTML = `
    <div class="panel">
      <label class="fld">Unix-таймстамп (секунды или мс)</label>
      <input type="text" id="ts" placeholder="1700000000" inputmode="numeric" autocomplete="off">

      <div class="stats" id="tsOut"></div>

      </div>
      <input type="datetime-local" id="dt" step="1">
      <div class="stats" id="dtOut"></div>
    </div>`;
  const $ = id => el.querySelector('#' + id);

  const fmtRel = (ms) => {
    const d = Date.now() - ms;
    const abs = Math.abs(d);
    const sec = Math.round(abs/1000), min = Math.round(abs/60000), hr = Math.round(abs/3600000);
    const day = Math.round(abs/86400000), mo = Math.round(abs/2592000000), yr = Math.round(abs/31536000000);
    let val;
    if (sec < 60) val = `${sec} сек`;
    else if (min < 60) val = `${min} мин`;
    else if (hr < 24) val = `${hr} ч`;
    else if (day < 30) val = `${day} дн`;
    else if (mo < 12) val = `${mo} мес`;
    else val = `${yr} г`;
    return d >= 0 ? `${val} назад` : `через ${val}`;
  };

  const updTs = () => {
    const raw = $('ts').value.trim();
    if (!raw){ $('tsOut').innerHTML = ''; refreshMainButton(); return; }
    let n = parseInt(raw.replace(/\D/g,''), 10);
    if (!isFinite(n)){ $('tsOut').innerHTML = ''; refreshMainButton(); return; }
    const ms = String(n).length > 10 ? n : n * 1000;
    const d = new Date(ms);
    if (isNaN(d.getTime())){ $('tsOut').innerHTML = ''; refreshMainButton(); return; }
    $('tsOut').innerHTML = `
      <div class="stat"><div class="v" style="font-size:14px">${d.toISOString()}</div><div class="k">ISO / UTC</div></div>
      <div class="stat"><div class="v" style="font-size:14px">${d.toLocaleString('ru-RU')}</div><div class="k">Локальное время</div></div>
      <div class="stat"><div class="v" style="font-size:14px">${Math.floor(ms/1000)}</div><div class="k">Секунды</div></div>
      <div class="stat"><div class="v" style="font-size:14px">${ms}</div><div class="k">Миллисекунды</div></div>
      <div class="stat" style="grid-column:1/-1"><div class="v" style="font-size:14px">${fmtRel(ms)}</div><div class="k">Относительно</div></div>
    `;
    refreshMainButton();
  };

  const updDt = () => {
    if (!$('dt').value){ $('dtOut').innerHTML = ''; return; }
    const d = new Date($('dt').value);
    if (isNaN(d.getTime())){ $('dtOut').innerHTML = ''; return; }
    const ms = d.getTime(), sec = Math.floor(ms/1000);
    $('dtOut').innerHTML = `
      <div class="stat"><div class="v" style="font-size:14px">${sec}</div><div class="k">Секунды</div></div>
      <div class="stat"><div class="v" style="font-size:14px">${ms}</div><div class="k">Миллисекунды</div></div>
    `;
    refreshMainButton();
  };

  $('ts').addEventListener('input', updTs);
  $('dt').addEventListener('input', updDt);
  $('nowBtn').onclick = () => {
    $('ts').value = String(Math.floor(Date.now()/1000));
    updTs();
  };

  setMainButton(() => {
    if ($('ts').value.trim()){
      return `Timestamp: ${$('ts').value}\n${$('tsOut').textContent.slice(0,200)}`;
    }
    if ($('dt').value){
      return `Дата: ${$('dt').value}\nСекунды: ${Math.floor(new Date($('dt').value).getTime()/1000)}`;
    }
    return '';
  });
}

/* ── 16. Сокращатель ─────────────────────────────────────── */
async function fetchWithTimeout(url, opts = {}, ms = 12000){
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
  finally { clearTimeout(id); }
}
async function shortenUrl(url){
  const attempts = [
    { name:'clck.ru',  run: () => fetchWithTimeout('https://clck.ru/--?url=' + encodeURIComponent(url)) },
    { name:'tinyurl',  run: () => fetchWithTimeout('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(url)) },
    { name:'is.gd',    run: () => fetchWithTimeout('https://is.gd/create.php?format=simple&url=' + encodeURIComponent(url)) }
  ];
  let lastErr = null;
  for (const a of attempts){
    try {
      const r = await a.run();
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = (await r.text()).trim();
      if (/^https?:\/\//i.test(text)) return { short: text, via: a.name };
      throw new Error('Некорректный ответ');
    } catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('Не удалось сократить');
}

    }
  };
  goBtn.onclick = run;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); run(); } });
  el.querySelector('#copyBtn').onclick = () => copyText(result);
  setMainButton(() => result);
  setTimeout(() => inp.focus(), 120);
}

/* ============================================================
   Поделиться картинкой (Web Share API)
   ============================================================ */
async function shareImageFile(dataUrl, fileName){
  try {
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const file = new File([blob], fileName, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: 'Изображение со скрытым сообщением'
      });
      return true;
    }
  } catch(e){
    if (e.name === 'AbortError') return true;
    console.warn('share failed', e);
  }
  return false;
}

/* ============================================================
   Навигация
   ============================================================ */
const mainEl  = document.getElementById('main');
const titleEl = document.getElementById('title');
const backBtn = document.getElementById('backBtn');

function goHome(){
  titleEl.textContent = 'Инструменты';
  backBtn.classList.add('hidden');
  _mbGetter = null;
  if (tg && tg.MainButton) { try { tg.MainButton.hide(); } catch(e){} }
  if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch(e){} }
  mainEl.innerHTML = `
    <div class="grid">
      ${Object.entries(TOOLS).map(([k,t]) => `
        <button class="card" data-tool="${k}">
          <span class="ico">${t.icon}</span>
          <span class="lbl">${esc(t.title)}</span>
        </button>`).join('')}
    </div>`;
  mainEl.querySelectorAll('[data-tool]').forEach(b => {
    b.addEventListener('click', () => openTool(b.dataset.tool));
  });
  window.scrollTo(0, 0);
}

function openTool(key){
  const t = TOOLS[key];
  if (!t) return;
  titleEl.textContent = t.title;
  backBtn.classList.remove('hidden');
  if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch(e){} }
  if (tg && tg.MainButton) { try { tg.MainButton.hide(); } catch(e){} }
  _mbGetter = null;
  mainEl.innerHTML = '';
  t.render(mainEl);
  window.scrollTo(0, 0);
}

/* ── Показать/скрыть пароль ─────────────────────────────── */
document.addEventListener('click', e => {
  const btn = e.target.closest('.pwd-toggle');
  if (!btn) return;
  const input = document.getElementById(btn.dataset.for);
  if (!input) return;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
  btn.classList.toggle('on', show);
  const pos = input.value.length;
  input.focus();
  try { input.setSelectionRange(pos, pos); } catch(_){}
});

backBtn.addEventListener('click', goHome);
goHome();
</script>
